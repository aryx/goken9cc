# -*- sh -*-

#LATER? for now we install libs and bins under ROOT/ to separate
# them from GO stuff but at some point we may want ROOT=$TOP and install in
# $TOP/bin and $TOP/lib? but will need $TOP/bin/amd64/ at least?
ROOT=$TOP/ROOT

#
# common mkfile parameters shared by all architectures
#

OS=5678ijve
CPUS=arm arm64 386 amd64 riscv riscv64 mips wasm

# note: CFLAGS itself (the host-compiler flags: -O0/-ggdb/--std=gnu89/...)
# is NOT defined here since it's gcc/clang specific -- see
# mkfiles/boot-gcc/mkfile and mkfiles/boot-clang/mkfile. Kept here only:
# LDFLAGS's -L is understood by both gcc/clang (host bootstrap) and by
# goken's own linkers (5l/6l/7l/8l/...), so it stays generic.
#note: SANITIZE is optionally set by ./configure --asan
LDFLAGS=-L$ROOT/$cputype/lib $SANITIZE

LEX=lex
#alt: bison but not always super compatible. apparently on my Linux /bin/yacc
# is actually bison in disguise but compatible :)
#old: used to be set in mkconfig to byacc or bison but now built by build-mk.sh
YACC=yacc

# recursive mk will have these set from the parent
# this is never what we want.  clear them
TARG=
OFILES=
HFILES=
YFILES=
