# -*- sh -*-

ROOT=$TOP/ROOT

#
# common mkfile parameters shared by all architectures
#

OS=5678ijvze
CPUS=arm arm64 386 amd64 riscv riscv64 mips alpha wasm 

# -I$TOP/include, -I$TOP/include/ALL and -I. are understood both by the
# host bootstrap compiler (gcc/clang) and by goken's own Xc compilers
# so they stay here as CFLAGS_COMMON for self-hosted 'mk objtype=$cputype'
# build to reuse. The rest of CFLAGS (-O0/-ggdb/--std=gnu89/... and
# -I$TOP/BOOT/include, the host libc-adaptation headers) is gcc/clang
# (host bootstrap) specific and lives in mkfiles/boot-gcc/mkfile and
# mkfiles/boot-clang/mkfile instead. 
CFLAGS_COMMON=-I$TOP/include -I$TOP/include/ALL -I.
# LDFLAGS's -L is likewise generic: understood by both the host linker
# and goken's own linkers (5l/6l/7l/8l/...).
#note: SANITIZE is optionally set by ./configure --asan
LDFLAGS=-L$ROOT/arch/$objtype/lib $SANITIZE

# libraries only the host bootstrap link needs: lib9.a (POSIX shim for
# Plan9-style calls) and the host's libm (goken's own libc.a already bakes
# in its own math/, see lib_core/libc/port/{sin,pow,sqrt,...}.c, and
# lib9.a's role is replaced by libc.h's own "#pragma lib libc.a" -- see
# mkfiles/boot-gcc/mkfile). Set to "-l9 -lm" only by boot-gcc/boot-clang.
# Leaf mkfiles reference $BOOTLIBS instead of hardcoding -l9/-lm so the
# same LDLIBS line works self-hosted too.
#
# claude: deliberately NOT assigned here (even to empty), same
# "eagerly-substituted one-element empty-string list" pitfall
# CFLAGS_EXTRA's own comment already documents (mkfiles/$objtype/mkfile,
# e.g. amd64's): a leaf mkfile whose LDLIBS is JUST "$BOOTLIBS" (e.g.
# utilities/time/mkfile) would otherwise pass a single stray empty
# argument to $LD for every non-boot objtype, which 6l/8l/etc. then try
# to open as a file ("??none??: cannot open : No such file or
# directory") -- found self-hosting utilities/time/date.c. An
# unassigned variable lets rc correctly expand it to zero words instead.
#BOOTLIBS=

# claude: the archiver key letters, split out of mkfiles/mklib and
# mkfiles/mksyslib's recipes so a caller can ask for a DETERMINISTIC
# archive without editing them: `ARFLAGS=rcD` makes goken's own iar zero
# each member's date and mode (linkers/ar/ar.c's Dflag, same idea as GNU
# ar -D), which is what makes two archives built from identical objects
# compare byte-for-byte -- the top-level mkfile's `bootstrap` target
# relies on exactly that for its stage-2-vs-stage-3 fixpoint check.
# Deliberately still plain "rc" by default: $AR is the HOST's ar for a
# boot-gcc/boot-clang build (mkfiles/boot-gcc/mkfile), and BSD ar, the
# one on a macOS host, has no D key at all.
ARFLAGS=rc

LEX=lex
#alt: bison but not always super compatible. apparently on my Linux /bin/yacc
# is actually bison in disguise but compatible :)
#old: used to be set in mkconfig to byacc or bison but now built by build-mk.sh
YACC=yacc

# recursive mk will have these set from the parent
# this is never what we want.  clear them
TARG=
OFILES=
HFILES=
YFILES=
